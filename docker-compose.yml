services:
  db:
    image: postgres:17-alpine
    container_name: expense-receipts-db
    # 「要用才開電腦」的模式:Docker Desktop 一啟動就把資料庫帶起來,
    # 使用者不必記得下 docker compose up。unless-stopped 是刻意的 ——
    # 手動 docker compose stop 之後不會又被拉起來。
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: expense_receipts
    ports:
      # host 5433,避免與 booking-crm 的 5432 衝突
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d expense_receipts"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
